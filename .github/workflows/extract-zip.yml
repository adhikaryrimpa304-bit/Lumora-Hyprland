
name: Extract LUMORA ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Extract project
        run: |
          set -e
          ZIP="LUMORA-Ubuntu-Hyprland-Features.zip"
          test -f "$ZIP"
          mkdir -p /tmp/lumora
          unzip -q "$ZIP" -d /tmp/lumora
          SRC="/tmp/lumora/LUMORA-Ubuntu-Hyprland"
          test -d "$SRC"
          rm -rf "$SRC/.github"
          cp -a "$SRC/." .
          rm "$ZIP"

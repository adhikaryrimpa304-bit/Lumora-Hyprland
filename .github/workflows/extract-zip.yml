
name: Extract LUMORA ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          ZIP="LUMORA-Ubuntu-Hyprland-Features.zip"
          test -f "$ZIP"
          mkdir -p /tmp/lumora
          unzip -q "$ZIP" -d /tmp/lumora
          cp -a /tmp/lumora/LUMORA-Ubuntu-Hyprland/. .
          rm "$ZIP"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract LUMORA source [skip ci]"
            git push
          fi

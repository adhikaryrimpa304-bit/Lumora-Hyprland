name: Build LUMORA Ubuntu 26.04 LTS Hyprland ISO
on:
  workflow_dispatch:
jobs:
  build:
    # Keep the hosted builder on a stable runner; linux/build-iso.sh targets Ubuntu 26.04 (resolute).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y live-build debootstrap squashfs-tools xorriso ubuntu-keyring ca-certificates grub-common fonts-dejavu-core
      - name: Static source checks
        run: bash linux/check-config.sh
      - name: Build experimental ISO
        run: WORK="$RUNNER_TEMP/lumora-build" bash linux/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lumora-ubuntu-hyprland-iso
          path: ${{ runner.temp }}/lumora-build/*.iso
          if-no-files-found: error
